name: CI

# Pull requests (including forks: GITHUB_TOKEN is read-only there and first-time
# contributors need the maintainer's approval), pushes to main for the status
# badge, and on demand.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Project file is up to date
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- MacPrompter.xcodeproj
      - name: Build and test
        run: scripts/check.sh
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/check.log
          retention-days: 7
