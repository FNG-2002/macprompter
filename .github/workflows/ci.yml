name: CI

# Pull requests (including forks: GITHUB_TOKEN is read-only there and first-time
# contributors need the maintainer's approval), pushes to main for the status
# badge, and on demand. scripts/ci_reuse.sh skips the build when the same tree
# was already tested (squash merge of a green PR) or only docs changed; the
# required "test" check still reports success.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Already tested or documentation only
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/ci_reuse.sh "$BASE"
      - name: Project file is up to date
        if: steps.reuse.outputs.skip != 'true'
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- MacPrompter.xcodeproj
      - name: Build and test
        if: steps.reuse.outputs.skip != 'true'
        run: scripts/check.sh
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/check.log
          retention-days: 7
